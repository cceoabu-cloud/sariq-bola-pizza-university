<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SBP UNIVERSITY</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:350px;
    background:#1b1b1b;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

h1{
    color:orange;
    margin-bottom:40px;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:orange;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:red;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="login-box">
    <h1>SBP UNIVERSITY</h1>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Parol">

    <button onclick="login()">Kirish</button>

    <div id="error"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA12QrqiVyQQ5KhGe_C6rUCpIzuToBm5bc",
  authDomain: "sariq-bola-pizza-university.firebaseapp.com",
  projectId: "sariq-bola-pizza-university",
  storageBucket: "sariq-bola-pizza-university.appspot.com",
  messagingSenderId: "653909202624",
  appId: "1:653909202624:web:33589a64a09471223476c5"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login = function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(() => {

alert("Tizimga muvaffaqiyatli kirdingiz!");

window.location.href =
"https://google.com";

})

.catch((error) => {

document.getElementById("error").innerText =
error.message;

});

}

</script>

</body>
</html>
